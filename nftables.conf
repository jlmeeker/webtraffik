# /etc/nftables.d/webtraffik.conf
# Generated by webTraffik firewall.sh — do not edit by hand.
# Re-run firewall.sh (or `make remote-install`) to regenerate.
#
# Strategy:
#   - Default input policy: DROP
#   - webTraffik capture ports: ACCEPT from anywhere (internet-facing)
#   - Everything else: ACCEPT only from the local management subnet
#   - NAT prerouting redirect for all capture ports (so the app receives them)

table inet webtraffik_filter {

    # ── Input chain ────────────────────────────────────────────────────────────
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback — always allow
        iif "lo" accept comment "loopback"

        # Established / related connections
        ct state established,related accept comment "stateful"

        # ICMP — needed for ping, path-MTU discovery, etc.
        ip  protocol icmp   accept comment "icmpv4"
        ip6 nexthdr  icmpv6 accept comment "icmpv6"

        # webTraffik capture ports — open to the internet
        tcp dport { __CAPTURE_PORTS__ } accept comment "webtraffik capture"

        # Everything else (SSH, dashboard :8999, any other listener) —
        # subnet-only.  This single rule covers all remaining services so
        # you never have to enumerate them.
        ip saddr __SUBNET__ accept comment "management subnet"

        # Implicit drop for everything else (policy drop above)
    }

    # ── Forward / output ───────────────────────────────────────────────────────
    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip webtraffik_nat {

    # ── NAT prerouting — redirect capture ports to the app ────────────────────
    chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport { __CAPTURE_PORTS__ } redirect comment "webtraffik nat"
    }
}
