<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>webTraffik — Recent Events</title>
    <script type="module" crossorigin src="/assets/recent-DuVlBEcY.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/services-DI3OThoC.js">
    <link rel="modulepreload" crossorigin href="/assets/log-DOoZRPdU.js">
    <link rel="stylesheet" crossorigin href="/assets/services-D72H18LU.css">
    <link rel="stylesheet" crossorigin href="/assets/recent-n4xTLvD3.css">
  </head>
  <body class="page-recent">
    <a class="skip-link" href="#event-list">Skip to events</a>
    <header class="app-header">
      <a class="brand" href="/" aria-label="webTraffik home">webTraffik</a>
      <div class="self-info">My IP: <b id="my-ip">&mdash;</b> &nbsp;|&nbsp; <b id="my-loc">&mdash;</b></div>
      <div class="toolbar" style="margin-left:auto">
        <button class="btn icon" type="button" data-theme-toggle title="Toggle theme">
          <span class="icon-sun" aria-hidden="true">&#9728;</span>
          <span class="icon-moon" aria-hidden="true">&#9790;</span>
        </button>
      </div>
      <nav class="app-nav" aria-label="Pages" style="margin-left:0">
        <a href="/">Live</a>
        <a href="/history.html">History</a>
        <a href="/recent.html">Recent</a>
      </nav>
    </header>

    <div class="recent-toolbar">
      <div class="info" role="status" aria-live="polite">
        Showing <b id="event-count">0</b> of <b id="total-count">0</b> events with client data
      </div>
      <div class="filters">
        <label for="filter-service">Service</label>
        <select class="select" id="filter-service"><option value="">All</option></select>
        <label for="filter-limit">Limit</label>
        <select class="select" id="filter-limit">
          <option value="100">100</option>
          <option value="250">250</option>
          <option value="500">500</option>
          <option value="1000" selected>1000</option>
        </select>
        <label class="check"><input type="checkbox" id="filter-data" checked /> only with data</label>
      </div>
      <div class="actions">
        <button class="btn" id="expand-all-btn" type="button" aria-pressed="false">Expand all data</button>
        <button class="btn primary" id="refresh-btn" type="button">Refresh</button>
      </div>
    </div>

    <div id="loading" class="loading-row"><span class="spinner"></span> Loading recent events…</div>
    <div id="empty-state" class="empty-state" hidden>No events in the ring buffer yet.</div>
    <main id="event-list" class="event-list" aria-label="Recent events"></main>
  </body>
</html>
