<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="webTraffik live connection map" />
    <title>webTraffik</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234fc3f7' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234fc3f7'/%3E%3C/svg%3E" />
    <script type="module" src="/src/pages/live.ts"></script>
  </head>
  <body class="page-live">
    <a class="skip-link" href="#log-panel">Skip to connection log</a>

    <header class="app-header">
      <a class="brand" href="/" aria-label="webTraffik home">
        <span id="ws-status" class="status-dot" data-status="connecting" role="status" aria-live="polite" aria-label="Connecting"></span>
        webTraffik
      </a>
      <div class="self-info">My IP: <b id="my-ip">&mdash;</b> &nbsp;|&nbsp; <b id="my-loc">&mdash;</b></div>

      <div class="toolbar">
        <span class="stat-pill" title="Connections in the selected window">Connections <b id="conn-count">0</b></span>
        <div class="control-group">
          <label for="time-slider">Window</label>
          <input type="range" id="time-slider" class="range" min="1" max="24" value="1" aria-valuetext="1 hour" />
          <span class="value" id="slider-label">1h</span>
        </div>
        <button id="noise-toggle" class="btn" type="button" aria-pressed="true" title="Hide connections that XDP saw but no listener answered (kind: observed)">Hide XDP noise</button>
        <button id="trace-mode" class="btn" type="button" aria-pressed="false" title="Strict traceroute: 200 km accuracy cut-off, 300 km/ms plausibility, clamp instead of drop">Strict trace</button>
        <button id="pause-btn" class="btn icon" type="button" aria-pressed="false" aria-label="Pause live updates" title="Pause / resume live updates (Space)">
          <svg class="icon-pause" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          <svg class="icon-play" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>
        </button>
        <button id="audio-toggle" class="btn icon" type="button" aria-pressed="false" aria-label="Toggle event sounds" title="Event sounds"><svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg></button>
        <button class="btn icon" type="button" data-theme-toggle title="Toggle theme">
          <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>

      <nav class="app-nav" aria-label="Pages">
        <a href="/">Live</a>
        <a href="/history.html">History</a>
        <a href="/recent.html">Recent</a>
      </nav>
    </header>

    <div id="dot-tooltip" class="dot-tooltip" role="dialog" aria-label="Source details">
      <div class="tip-label"></div>
      <div class="tip-ip"></div>
      <div class="tip-badges"></div>
      <button class="tip-trace" type="button">Trace route</button>
      <button class="tip-ban" type="button">Ban</button>
    </div>

    <main id="map-container" aria-label="Live map">
      <svg id="map"></svg>
      <div id="trace-indicator" class="trace-indicator" role="status" aria-live="polite"></div>
      <div id="zoom-level" class="zoom-level" aria-hidden="true">1.0x</div>
      <div id="stream-notice" class="stream-notice" role="status" aria-live="polite" hidden></div>

      <div class="panel-toggles" aria-hidden="false">
        <button class="btn icon panel-toggle" type="button" data-drawer="left" aria-expanded="false" aria-controls="left-panels" aria-label="Toggle services panel"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button class="btn icon panel-toggle" type="button" data-drawer="right" aria-expanded="false" aria-controls="right-panels" aria-label="Toggle security panels"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v4M12 16h.01"/></svg></button>
      </div>

      <aside id="left-panels" class="panel-stack left" aria-label="Traffic panels">
        <section class="panel" id="panel-service" aria-labelledby="h-services">
          <h2 id="h-services">Top Services</h2>
          <div id="service-rows" role="list"></div>
        </section>
        <section class="panel" id="panel-ebpf" aria-labelledby="h-ebpf">
          <h2 id="h-ebpf">Capture Mode</h2>
          <div id="ebpf-rows"></div>
        </section>
      </aside>

      <aside id="right-panels" class="panel-stack right" aria-label="Security panels">
        <section class="panel panel-warn" id="panel-scanners" aria-labelledby="h-scanners">
          <h2 id="h-scanners">Port Scanners <span class="count" id="scanner-count">0</span></h2>
          <div id="scanner-rows" role="list"></div>
        </section>
        <section class="panel panel-danger" id="panel-banned" aria-labelledby="h-banned">
          <h2 id="h-banned">Banned <span class="count" id="banned-count">0</span></h2>
          <div id="banned-rows" role="list"></div>
        </section>
        <section class="panel" id="panel-lastseen" aria-labelledby="h-lastseen">
          <h2 id="h-lastseen">Last Seen</h2>
          <div id="lastseen-rows"></div>
        </section>
      </aside>

      <div id="magnifier" class="magnifier" aria-hidden="true">
        <span class="mag-label">zoom</span>
        <svg id="mag-svg" role="img" aria-label="Magnified arc"></svg>
      </div>
    </main>

    <section id="log-panel" class="log-panel" aria-label="Connection log" aria-live="off"></section>
  </body>
</html>
