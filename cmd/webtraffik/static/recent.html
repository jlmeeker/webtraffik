<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webTraffik — Recent Events</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: rgba(14, 24, 46, 0.92);
      border-bottom: 1px solid #2a4a70;
      flex-shrink: 0;
    }

    #toolbar .info {
      font-size: 0.7rem;
      color: #6a8aaa;
    }

    #toolbar .info span { color: #4fc3f7; }

    #toolbar .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #toolbar .filters {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #toolbar .filters label {
      font-size: 0.65rem;
      color: #6a8aaa;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #toolbar .filters select {
      background: #0f1e35;
      border: 1px solid #2a4a70;
      border-radius: 4px;
      color: #dce8f8;
      font-family: inherit;
      font-size: 0.72rem;
      padding: 4px 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    #toolbar .filters select:focus { border-color: #4fc3f7; }

    .btn {
      background: #2a4a70;
      border: 1px solid #3a6090;
      border-radius: 4px;
      color: #dce8f8;
      font-family: inherit;
      font-size: 0.72rem;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn:hover { background: #3a6090; border-color: #4fc3f7; }
    .btn:active { background: #4fc3f7; color: #111827; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .btn-expand {
      font-size: 0.65rem;
      padding: 3px 10px;
    }

    /* ── Log list ── */
    #event-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px;
      font-size: 0.68rem;
      line-height: 1.6;
    }

    #event-list::-webkit-scrollbar { width: 4px; }

    .log-data-hint {
      color: #6a8aaa;
      font-size: 0.58rem;
      cursor: pointer;
      margin-left: 6px;
      user-select: none;
    }
    .log-data-hint:hover { color: #80cbc4; }

    .log-client-data {
      display: none;
      width: 100%;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.62rem;
      color: #80cbc4;
      background: rgba(0,0,0,0.25);
      border-radius: 3px;
      padding: 3px 6px;
      margin-top: 2px;
      white-space: pre;
      overflow-x: auto;
      max-width: 100%;
      line-height: 1.3;
    }

    .log-entry.expanded .log-client-data { display: block; }

    /* ── Loading state ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #6a8aaa;
      font-size: 0.75rem;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #2a4a70;
      border-top-color: #4fc3f7;
      margin-right: 10px;
    }

    /* ── Empty state ── */
    #empty-state {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: #4a6a88;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<header>
  <h1>webTraffik</h1>
  <div id="self-info">My IP: <span id="my-ip">&mdash;</span> &nbsp;|&nbsp; <span id="my-loc">&mdash;</span></div>
  <nav>
    <a href="/">Live Map</a>
    <a href="/history.html">History</a>
    <a href="/recent.html" class="active">Recent</a>
  </nav>
</header>

<div id="toolbar">
  <div class="info">
    Showing <span id="event-count">0</span> of <span id="total-count">0</span> events
  </div>
  <div class="filters">
    <label>Service:</label>
    <select id="filter-service"><option value="">All</option></select>
    <label>Limit:</label>
    <select id="filter-limit">
      <option value="100">100</option>
      <option value="250">250</option>
      <option value="500">500</option>
      <option value="1000" selected>1000</option>
    </select>
  </div>
  <div class="actions">
    <button class="btn btn-expand" id="expand-all-btn">Expand All Data</button>
    <button class="btn" id="refresh-btn">Refresh</button>
  </div>
</div>

<div id="loading"><div class="spinner"></div>Loading recent events...</div>
<div id="empty-state">No events in the ring buffer yet.</div>
<div id="event-list"></div>

<!-- Port → service name map (single source of truth) -->
<script src="/services.js"></script>
<!-- Shared utilities: setCookie/getCookie, hexPreview, fetchSelf -->
<script src="/common.js"></script>
<script src="/recent.js"></script>
</body>
</html>
