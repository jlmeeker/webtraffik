<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webTraffik</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    /* index.html overrides body for full-viewport layout */
    body {
      height: 100vh;
      overflow: hidden;
    }

    #stats {
      font-size: 0.72rem;
      color: #8eaac4;
    }
    #stats span { color: #ffb74d; }

    /* ── Time window slider ── */
    #time-slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: #8eaac4;
    }
    #time-slider-group label { white-space: nowrap; }
    #time-slider-group .slider-value { color: #4fc3f7; min-width: 24px; text-align: center; }
    #time-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 4px;
      background: #2a4a70;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4fc3f7;
      cursor: pointer;
    }
    #time-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4fc3f7;
      border: none;
      cursor: pointer;
    }

    #audio-toggle {
      background: none;
      border: 1px solid #3a5a80;
      border-radius: 4px;
      color: #6a8aaa;
      font-size: 0.82rem;
      padding: 2px 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      line-height: 1;
    }
    #audio-toggle:hover { color: #a0bcd8; border-color: #4a7ab0; }
    #audio-toggle.active { color: #4fc3f7; border-color: #4fc3f7; }

    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    svg#map {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    svg#map:active {
      cursor: grabbing;
    }

    /* ── Zoom level indicator ── */
    #zoom-level {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 0.62rem;
      color: #6a8aaa;
      background: rgba(14, 24, 46, 0.80);
      border: 1px solid #2a4a70;
      border-radius: 4px;
      padding: 2px 8px;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #zoom-level.visible { opacity: 1; }

    /* ── Corner overlay panels ── */
    .corner-panel {
      position: absolute;
      width: 190px;
      /* 
         max-height: 70%;
         overflow-y: auto;
      */
      background: rgba(14, 24, 46, 0.88);
      border: 1px solid #2a4a70;
      border-radius: 6px;
      padding: 8px 0;
      z-index: 5;
      pointer-events: auto;
    }

    .corner-panel::-webkit-scrollbar { width: 3px; }

    .top-left     { top: 10px; left: 10px; }
    .top-right    { top: 10px; right: 10px; }

    .corner-panel h2 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6a8aaa;
      padding: 0 10px 6px;
      border-bottom: 1px solid #2a4a70;
      margin-bottom: 4px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px;
      animation: fadeIn 0.3s ease;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #a0bcd8;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-count {
      font-size: 0.7rem;
      color: #ffb74d;
      min-width: 28px;
      text-align: right;
    }

    .graticule { fill: none; stroke: #1a3a55; stroke-width: 0.5px; }
    .sphere { fill: #0d1b2e; }
    .land  { fill: #1a2f4a; stroke: #2e5278; stroke-width: 0.4px; }
    .border { fill: none; stroke: #3a6090; stroke-width: 0.4px; }
    .lake  { fill: #0f2035; stroke: #1e3a5a; stroke-width: 0.3px; }
    .river { fill: none; stroke: #1a3550; stroke-width: 0.4px; }

    .self-dot {
      fill: #4fc3f7;
      r: 5;
      filter: url(#glow-blue);
    }

    .arc-path {
      fill: none;
      stroke-linecap: round;
    }

    .arc-path.resting {
      pointer-events: none;
    }

    .arc-pulse {
      fill: none;
      stroke-linecap: round;
      pointer-events: none;
    }

    .src-dot {
      r: 4;
      pointer-events: all;
    }

    /* Log panel */
    #log-panel {
      background: rgba(14, 24, 46, 0.94);
      border-top: 1px solid #2a4a70;
      height: 130px;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 4px 12px;
      font-size: 0.68rem;
      line-height: 1.6;
    }

    #log-panel::-webkit-scrollbar { width: 4px; }

    .log-entry {
      animation: fadeIn 0.3s ease;
      cursor: pointer;
    }
    .log-entry:hover { background: rgba(79,195,247,0.08); }
    .log-entry.arc-flash { background: rgba(79,195,247,0.22); transition: background 0.15s; }

    /* ── Banned IPs panel ── */
    .ban-row {
      display: flex;
      flex-direction: column;
      padding: 4px 10px;
      gap: 1px;
      border-bottom: 1px solid rgba(239,83,80,0.12);
      animation: fadeIn 0.3s ease;
    }
    .ban-row:last-child { border-bottom: none; }
    .ban-ip {
      font-size: 0.68rem;
      color: #ef5350;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ban-meta {
      font-size: 0.62rem;
      color: #6a8aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ban-expire {
      font-size: 0.60rem;
      color: #4a6a88;
    }
    #panel-banned h2 { color: #ef5350; border-bottom-color: rgba(239,83,80,0.25); }
    #panel-banned .ban-empty {
      font-size: 0.65rem;
      color: #4a6a88;
      padding: 6px 10px;
      font-style: italic;
    }

    #ws-status {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #6a8aaa;
      display: inline-block;
      margin-right: 6px;
      transition: background 0.3s;
    }
    #ws-status.connected    { background: #66bb6a; box-shadow: 0 0 6px #66bb6a; }
    #ws-status.disconnected { background: #ef5350; }

    /* ── Magnifier inset ── */
    #magnifier {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 300px;
      background: rgba(14, 24, 46, 0.94);
      border: 1px solid #2a4a70;
      border-radius: 8px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 2px rgba(79, 195, 247, 0.2);
    }
    #magnifier.visible { opacity: 1; }
    #magnifier svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #magnifier .mag-label {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6a8aaa;
      pointer-events: none;
    }
    #magnifier .mag-land   { fill: #1a2f4a; stroke: #2e5278; stroke-width: 0.5px; }
    #magnifier .mag-border { fill: none; stroke: #3a6090; stroke-width: 0.3px; }
    #magnifier .mag-sphere { fill: #0d1b2e; }
    #magnifier .mag-lake   { fill: #0f2035; stroke: #1e3a5a; stroke-width: 0.3px; }
    #magnifier .mag-river  { fill: none; stroke: #1a3550; stroke-width: 0.5px; }
    #magnifier .mag-arc    { fill: none; stroke-linecap: round; }
    #magnifier .mag-dot    { }
    #magnifier .mag-self-dot {
      fill: #4fc3f7;
      filter: url(#mag-glow-blue);
    }

    /* ── Banned dot styling ── */
    .src-dot.banned {
      stroke: #ef5350;
      stroke-width: 2px;
      stroke-opacity: 0.9;
      fill: #ef5350 !important;
      animation: banned-pulse 1.4s ease-in-out infinite;
    }
    @keyframes banned-pulse {
      0%, 100% { stroke-opacity: 0.9; stroke-width: 2px; }
      50%       { stroke-opacity: 0.3; stroke-width: 5px; }
    }

    /* ── Dot hover card (tooltip + ban button) ── */
    #dot-tooltip {
      position: fixed;
      pointer-events: auto;
      background: rgba(14, 24, 46, 0.97);
      border: 1px solid #2a4a70;
      color: #dce8f8;
      font-size: 0.72rem;
      border-radius: 5px;
      display: none;
      z-index: 100;
      min-width: 130px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    #dot-tooltip .tip-label {
      padding: 5px 10px 4px;
      white-space: nowrap;
    }
    #dot-tooltip .tip-ban {
      display: block;
      width: 100%;
      padding: 4px 10px 5px;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      text-align: left;
      background: none;
      border: none;
      border-top: 1px solid #2a4a70;
      cursor: pointer;
      font-family: inherit;
      color: #ef9a9a;
      transition: background 0.15s, color 0.15s;
    }
    #dot-tooltip .tip-ban:hover {
      background: rgba(239,83,80,0.18);
      color: #ef5350;
    }
    #dot-tooltip .tip-ban.tip-unban {
      color: #80cbc4;
    }
    #dot-tooltip .tip-ban.tip-unban:hover {
      background: rgba(128,203,196,0.15);
      color: #4db6ac;
    }
  </style>
</head>
<body>

<header>
  <h1><span id="ws-status"></span>webTraffik</h1>
  <div id="self-info">My IP: <span id="my-ip">—</span> &nbsp;|&nbsp; <span id="my-loc">—</span></div>
  <div style="display:flex;align-items:center;gap:18px">
    <div id="stats">Connections: <span id="conn-count">0</span></div>
    <div id="time-slider-group">
      <label>Window:</label>
      <input type="range" id="time-slider" min="1" max="24" value="1" />
      <span class="slider-value" id="slider-label">1h</span>
    </div>
    <button id="audio-toggle" title="Toggle event audio">&#9834;</button>
    <a href="/history.html" style="color:#78909c;text-decoration:none;font-size:0.72rem;letter-spacing:0.05em;transition:color 0.2s" onmouseover="this.style.color='#4fc3f7'" onmouseout="this.style.color='#78909c'">History</a>
    <a href="/recent.html" style="color:#78909c;text-decoration:none;font-size:0.72rem;letter-spacing:0.05em;transition:color 0.2s" onmouseover="this.style.color='#4fc3f7'" onmouseout="this.style.color='#78909c'">Recent</a>
  </div>
</header>

<div id="dot-tooltip">
  <div class="tip-label" id="tip-label-text"></div>
  <button class="tip-ban" id="tip-ban-btn"></button>
</div>

<div id="map-container">
  <svg id="map"></svg>
  <!-- Zoom level indicator -->
  <div id="zoom-level">1.0x</div>
  <!-- Corner overlay panels -->
  <div id="panel-service" class="corner-panel top-left">
    <h2>Top Services</h2>
    <div id="service-rows"></div>
  </div>
  <div id="panel-banned" class="corner-panel top-right">
    <h2>Banned IPs</h2>
    <div id="banned-rows"></div>
  </div>
  <!-- Magnifier inset -->
  <div id="magnifier">
    <span class="mag-label">zoom</span>
    <svg id="mag-svg"></svg>
  </div>
</div>

<div id="log-panel" id="log"></div>

<!-- D3 v7 (self-contained) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<!-- TopoJSON -->
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<!-- Port → service name map (single source of truth) -->
<script src="/services.js"></script>
<!-- Shared utilities: setCookie/getCookie, hexPreview, fetchSelf -->
<script src="/common.js"></script>

<script src="/index.js"></script>

</body>
</html>
