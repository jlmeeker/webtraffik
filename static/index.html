<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webTraffik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e1a;
      color: #c8d8f0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      background: rgba(12, 20, 40, 0.95);
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #4fc3f7;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #self-info {
      font-size: 0.72rem;
      color: #78909c;
    }

    #self-info span { color: #80cbc4; }

    #stats {
      font-size: 0.72rem;
      color: #78909c;
    }
    #stats span { color: #ffb74d; }

    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    svg#map {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Corner overlay panels ── */
    .corner-panel {
      position: absolute;
      width: 190px;
      max-height: 45%;
      overflow-y: auto;
      background: rgba(8, 15, 30, 0.82);
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 8px 0;
      z-index: 5;
      pointer-events: auto;
    }

    .corner-panel::-webkit-scrollbar { width: 3px; }
    .corner-panel::-webkit-scrollbar-thumb { background: #1e3a5f; }

    .top-left     { top: 10px; left: 10px; }
    .top-right    { top: 10px; right: 10px; }
    .bottom-left  { bottom: 10px; left: 10px; }
    .bottom-right { bottom: 10px; right: 10px; }

    .corner-panel h2 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #546e7a;
      padding: 0 10px 6px;
      border-bottom: 1px solid #1e3a5f;
      margin-bottom: 4px;
    }

    .port-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px;
      animation: fadeIn 0.3s ease;
    }

    .port-swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .port-label {
      font-size: 0.7rem;
      color: #90a4ae;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .port-label .port-num {
      color: #e0e0e0;
      font-weight: 600;
    }

    .port-count {
      font-size: 0.7rem;
      color: #ffb74d;
      min-width: 28px;
      text-align: right;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px;
      animation: fadeIn 0.3s ease;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #90a4ae;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-count {
      font-size: 0.7rem;
      color: #ffb74d;
      min-width: 28px;
      text-align: right;
    }

    .graticule { fill: none; stroke: #0d2035; stroke-width: 0.5px; }
    .sphere { fill: #060d1a; }
    .land  { fill: #122035; stroke: #1e3a5f; stroke-width: 0.4px; }
    .border { fill: none; stroke: #0d2035; stroke-width: 0.3px; }
    .lake  { fill: #0a1a2e; stroke: #1a3050; stroke-width: 0.3px; }
    .river { fill: none; stroke: #0e2540; stroke-width: 0.4px; }

    .self-dot {
      fill: #4fc3f7;
      r: 5;
      filter: url(#glow-blue);
    }

    .arc-path {
      fill: none;
      stroke-linecap: round;
    }

    .src-dot {
      r: 4;
    }

    /* Log panel */
    #log-panel {
      background: rgba(8, 15, 30, 0.92);
      border-top: 1px solid #1e3a5f;
      height: 130px;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 4px 12px;
      font-size: 0.68rem;
      line-height: 1.6;
    }

    #log-panel::-webkit-scrollbar { width: 4px; }
    #log-panel::-webkit-scrollbar-thumb { background: #1e3a5f; }

    .log-entry {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(30,58,95,0.3);
      padding: 2px 0;
      animation: fadeIn 0.3s ease;
      cursor: pointer;
    }
    .log-entry:hover { background: rgba(79,195,247,0.08); }
    .log-entry.arc-flash { background: rgba(79,195,247,0.22); transition: background 0.15s; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    .log-time  { color: #546e7a; min-width: 80px; }
    .log-src   { color: #ffb74d; flex: 1; }
    .log-arrow { color: #455a64; }
    .log-port  { color: #4fc3f7; }
    .log-proto { color: #78909c; font-size: 0.62rem; min-width: 28px; text-align: right; }

    #ws-status {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #546e7a;
      display: inline-block;
      margin-right: 6px;
      transition: background 0.3s;
    }
    #ws-status.connected    { background: #66bb6a; box-shadow: 0 0 6px #66bb6a; }
    #ws-status.disconnected { background: #ef5350; }

    /* ── Magnifier inset ── */
    #magnifier {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 300px;
      background: rgba(6, 13, 26, 0.92);
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6), 0 0 2px rgba(79, 195, 247, 0.15);
    }
    #magnifier.visible { opacity: 1; }
    #magnifier svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #magnifier .mag-label {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #546e7a;
      pointer-events: none;
    }
    #magnifier .mag-land   { fill: #122035; stroke: #1e3a5f; stroke-width: 0.5px; }
    #magnifier .mag-border { fill: none; stroke: #0d2035; stroke-width: 0.3px; }
    #magnifier .mag-sphere { fill: #060d1a; }
    #magnifier .mag-lake   { fill: #0a1a2e; stroke: #1a3050; stroke-width: 0.3px; }
    #magnifier .mag-river  { fill: none; stroke: #0e2540; stroke-width: 0.5px; }
    #magnifier .mag-arc    { fill: none; stroke-linecap: round; }
    #magnifier .mag-dot    { }
    #magnifier .mag-self-dot {
      fill: #4fc3f7;
      filter: url(#mag-glow-blue);
    }

    /* ── Dot tooltip ── */
    #dot-tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(8, 15, 30, 0.92);
      border: 1px solid #1e3a5f;
      color: #c8d8f0;
      font-size: 0.72rem;
      padding: 4px 9px;
      border-radius: 4px;
      white-space: nowrap;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<header>
  <h1><span id="ws-status"></span>webTraffik</h1>
  <div id="self-info">My IP: <span id="my-ip">—</span> &nbsp;|&nbsp; <span id="my-loc">—</span></div>
  <div style="display:flex;align-items:center;gap:18px">
    <div id="stats">Connections: <span id="conn-count">0</span></div>
    <a href="/history.html" style="color:#78909c;text-decoration:none;font-size:0.72rem;letter-spacing:0.05em;transition:color 0.2s" onmouseover="this.style.color='#4fc3f7'" onmouseout="this.style.color='#78909c'">History</a>
  </div>
</header>

<div id="dot-tooltip"></div>

<div id="map-container">
  <svg id="map"></svg>
  <!-- Corner overlay panels -->
  <div id="panel-port" class="corner-panel top-left">
    <h2>Traffic by Port</h2>
    <div id="port-rows"></div>
  </div>
  <div id="panel-service" class="corner-panel top-right">
    <h2>Top Services</h2>
    <div id="service-rows"></div>
  </div>
  <div id="panel-country" class="corner-panel bottom-left">
    <h2>Traffic by Country</h2>
    <div id="country-rows"></div>
  </div>
  <div id="panel-ip" class="corner-panel bottom-right">
    <h2>Traffic by IP</h2>
    <div id="ip-rows"></div>
  </div>
  <!-- Magnifier inset -->
  <div id="magnifier">
    <span class="mag-label">zoom</span>
    <svg id="mag-svg"></svg>
  </div>
</div>

<div id="log-panel" id="log"></div>

<!-- D3 v7 (self-contained) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<!-- TopoJSON -->
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
(() => {
  // ── State ────────────────────────────────────────────────────────────────
  let selfPos = null;    // { lat, lon, ip, city, cc }
  let connCount = 0;
  let replayDone = false; // becomes true after first non-replay event

  // Port stats: { portStr -> { count, color } }
  const portStats = {};
  let portColorIdx = 0;

  // Palette for port swatches (distinct from arc palette)
  const PORT_COLORS = [
    '#4fc3f7', '#ffb74d', '#81c784', '#f06292',
    '#ce93d8', '#80cbc4', '#fff176', '#ff8a65',
    '#90caf9', '#a5d6a7', '#ef9a9a', '#b39ddb',
  ];

  // ── Map setup ────────────────────────────────────────────────────────────
  const svg = d3.select('#map');
  const mapEl = document.getElementById('map');
  function dims() {
    return { w: mapEl.clientWidth, h: mapEl.clientHeight };
  }

  let { w, h } = dims();

  const projection = d3.geoNaturalEarth1()
    .scale(w / 6.3)
    .translate([w / 2, h / 2]);

  const path = d3.geoPath().projection(projection);

  // Defs: glow filters
  const defs = svg.append('defs');

  function makeGlow(id, color) {
    const f = defs.append('filter').attr('id', id).attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
    f.append('feGaussianBlur').attr('in', 'SourceGraphic').attr('stdDeviation', 3).attr('result', 'blur');
    const merge = f.append('feMerge');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');
  }

  makeGlow('glow-blue',   '#4fc3f7');
  // glow-orange and glow-green removed — only self-dot uses glow-blue

  // Gradient pool for arcs — reuse gradients by color pair instead of
  // creating a new <linearGradient> per arc.  Each key is "c1|c2".
  const gradientPool = new Map(); // key -> { el, refCount }

  function acquireGradient(c1, c2, x0, y0, x1, y1) {
    const key = c1 + '|' + c2;
    let entry = gradientPool.get(key);
    if (!entry) {
      const id = `arc-grad-${gradientPool.size}`;
      const g = defs.append('linearGradient').attr('id', id)
        .attr('gradientUnits', 'userSpaceOnUse');
      g.append('stop').attr('offset', '0%').attr('stop-color', c1).attr('stop-opacity', 0.9);
      g.append('stop').attr('offset', '100%').attr('stop-color', c2).attr('stop-opacity', 0.9);
      entry = { el: g, id, refCount: 0 };
      gradientPool.set(key, entry);
    }
    entry.refCount++;
    // Update coordinates to latest arc (good enough — gradients are similar angles)
    entry.el.attr('x1', x0).attr('y1', y0).attr('x2', x1).attr('y2', y1);
    return entry;
  }

  function releaseGradient(c1, c2) {
    const key = c1 + '|' + c2;
    const entry = gradientPool.get(key);
    if (entry) {
      entry.refCount--;
      // Keep gradient in DOM even at refCount 0 — it will be reused
    }
  }

  const sphereGroup = svg.append('g');
  const graticuleGroup = svg.append('g');
  const landGroup = svg.append('g');
  const arcGroup = svg.append('g');
  const dotGroup = svg.append('g');

  const graticule = d3.geoGraticule()();

  // Draw sphere + graticule
  sphereGroup.append('path')
    .datum({ type: 'Sphere' })
    .attr('class', 'sphere')
    .attr('d', path);

  graticuleGroup.append('path')
    .datum(graticule)
    .attr('class', 'graticule')
    .attr('d', path);

  // Load world TopoJSON (sane-topojson includes lakes + rivers layers)
  const WORLD_URL = 'https://cdn.jsdelivr.net/npm/sane-topojson@4/dist/world_110m.json';
  let worldLandGeo = null;   // cached for magnifier
  let worldBorderGeo = null; // cached for magnifier
  let worldLakesGeo = null;  // cached for magnifier
  let worldRiversGeo = null; // cached for magnifier

  d3.json(WORLD_URL).then(world => {
    worldLandGeo = topojson.feature(world, world.objects.land);
    worldBorderGeo = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);
    worldLakesGeo = topojson.feature(world, world.objects.lakes);
    worldRiversGeo = topojson.feature(world, world.objects.rivers);

    landGroup.append('path')
      .datum(worldLandGeo)
      .attr('class', 'land')
      .attr('d', path);

    landGroup.append('path')
      .datum(worldBorderGeo)
      .attr('class', 'border')
      .attr('d', path);

    landGroup.append('path')
      .datum(worldLakesGeo)
      .attr('class', 'lake')
      .attr('d', path);

    landGroup.append('path')
      .datum(worldRiversGeo)
      .attr('class', 'river')
      .attr('d', path);

    // Initialize magnifier now that geo data is available
    magInit();
  });

  // ── Magnifier inset ─────────────────────────────────────────────────────
  const MAG_IDLE_MS = 5000;       // fade out after 5s of no events
  const MAG_PAD_DEG = 8;          // padding around bbox in degrees
  const MAG_MIN_SPAN = 15;        // minimum bbox span in degrees (prevents over-zoom)
  const MAG_W = 420;
  const MAG_H = 300;

  const magEl = document.getElementById('magnifier');
  const magSvg = d3.select('#mag-svg');
  let magIdleTimer = null;
  let magVisible = false;
  let magInitialized = false;

  // Magnifier has its own projection, path generator, and SVG groups
  // Use Mercator for the magnifier — it zooms cleanly to any region
  // (geoNaturalEarth1 is designed for world-scale views and fitSize
  // doesn't produce tight zoom on small bounding boxes)
  const magProjection = d3.geoMercator();
  const magPath = d3.geoPath().projection(magProjection);
  let magSphereGroup, magLandGroup, magArcGroup, magDotGroup;

  function magInit() {
    if (magInitialized) return;
    magInitialized = true;

    // Magnifier needs its own glow filter (can't reference #map's defs)
    const magDefs = magSvg.append('defs');
    const mf = magDefs.append('filter').attr('id', 'mag-glow-blue')
      .attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
    mf.append('feGaussianBlur').attr('in', 'SourceGraphic').attr('stdDeviation', 3).attr('result', 'blur');
    const mm = mf.append('feMerge');
    mm.append('feMergeNode').attr('in', 'blur');
    mm.append('feMergeNode').attr('in', 'blur');
    mm.append('feMergeNode').attr('in', 'SourceGraphic');

    magSphereGroup = magSvg.append('g');
    magLandGroup = magSvg.append('g');
    magArcGroup = magSvg.append('g');
    magDotGroup = magSvg.append('g');

    magSphereGroup.append('path')
      .datum({ type: 'Sphere' })
      .attr('class', 'mag-sphere')
      .attr('d', magPath);

    if (worldLandGeo) {
      magLandGroup.append('path')
        .datum(worldLandGeo)
        .attr('class', 'mag-land')
        .attr('d', magPath);
    }
    if (worldBorderGeo) {
      magLandGroup.append('path')
        .datum(worldBorderGeo)
        .attr('class', 'mag-border')
        .attr('d', magPath);
    }
    if (worldLakesGeo) {
      magLandGroup.append('path')
        .datum(worldLakesGeo)
        .attr('class', 'mag-lake')
        .attr('d', magPath);
    }
    if (worldRiversGeo) {
      magLandGroup.append('path')
        .datum(worldRiversGeo)
        .attr('class', 'mag-river')
        .attr('d', magPath);
    }
  }

  // Fit the magnifier projection to a bounding box around src and dst
  function magFitBbox(srcPt, dstPt) {
    let lonMin = Math.min(srcPt[0], dstPt[0]) - MAG_PAD_DEG;
    let lonMax = Math.max(srcPt[0], dstPt[0]) + MAG_PAD_DEG;
    let latMin = Math.min(srcPt[1], dstPt[1]) - MAG_PAD_DEG;
    let latMax = Math.max(srcPt[1], dstPt[1]) + MAG_PAD_DEG;

    // Enforce minimum span to prevent over-zoom on short arcs
    const lonSpan = lonMax - lonMin;
    const latSpan = latMax - latMin;
    if (lonSpan < MAG_MIN_SPAN) {
      const pad = (MAG_MIN_SPAN - lonSpan) / 2;
      lonMin -= pad; lonMax += pad;
    }
    if (latSpan < MAG_MIN_SPAN) {
      const pad = (MAG_MIN_SPAN - latSpan) / 2;
      latMin -= pad; latMax += pad;
    }

    // Clamp to valid ranges
    lonMin = Math.max(-180, lonMin);
    lonMax = Math.min(180, lonMax);
    latMin = Math.max(-85, latMin);
    latMax = Math.min(85, latMax);

    // Manually compute center, scale, and translate for Mercator.
    // This avoids fitSize issues where D3's internal bbox computation
    // doesn't produce meaningful zoom on small regions.
    const centerLon = (lonMin + lonMax) / 2;
    const centerLat = (latMin + latMax) / 2;

    // Project corner points at scale=1, center=[0,0] to measure span
    magProjection
      .scale(1)
      .center([0, 0])
      .translate([0, 0]);

    const topLeft = magProjection([lonMin, latMax]);
    const bottomRight = magProjection([lonMax, latMin]);

    const projW = Math.abs(bottomRight[0] - topLeft[0]);
    const projH = Math.abs(bottomRight[1] - topLeft[1]);

    // Scale to fit the inset with some margin
    const margin = 0.85; // use 85% of inset area
    const scale = margin * Math.min(MAG_W / projW, MAG_H / projH);

    magProjection
      .scale(scale)
      .center([centerLon, centerLat])
      .translate([MAG_W / 2, MAG_H / 2]);
  }

  // Redraw the magnifier's static map layers after projection change
  function magRedrawMap() {
    magSphereGroup.select('path').attr('d', magPath);
    magLandGroup.selectAll('path').attr('d', magPath);
  }

  // Show the magnifier for a given arc event
  function magShowArc(ev, srcPt, dstPt, c1, c2, hitCount) {
    if (!magInitialized || !worldLandGeo) return;

    // Fit projection to the arc's bounding box
    magFitBbox(srcPt, dstPt);
    magRedrawMap();

    // Clear previous arc/dots in magnifier
    magArcGroup.selectAll('*').remove();
    magDotGroup.selectAll('*').remove();

    // Project points in magnifier space
    const [mx0, my0] = magProjection(srcPt);
    const [mx1, my1] = magProjection(dstPt);

    // Draw great-circle arc in magnifier
    const interp = d3.geoInterpolate(srcPt, dstPt);
    const N = 30; // higher fidelity for zoomed view
    const lineData = [];
    for (let i = 0; i <= N; i++) lineData.push(magProjection(interp(i / N)));
    const lineGen = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveNatural);
    const fullD = lineGen(lineData);

    // Approximate path length
    let totalLen = 0;
    for (let i = 1; i < lineData.length; i++) {
      const dx = lineData[i][0] - lineData[i - 1][0];
      const dy = lineData[i][1] - lineData[i - 1][1];
      totalLen += Math.sqrt(dx * dx + dy * dy);
    }

    const sw = Math.min(8, 2 + (hitCount - 1) * 0.5);
    const magArc = magArcGroup.append('path')
      .attr('class', 'mag-arc')
      .attr('d', fullD)
      .attr('stroke', c1)
      .attr('stroke-width', sw)
      .attr('stroke-dasharray', totalLen)
      .attr('stroke-dashoffset', totalLen)
      .attr('opacity', 1);

    magArc.transition()
      .duration(800)
      .ease(d3.easeQuadInOut)
      .attr('stroke-dashoffset', 0);

    // Source dot
    const dotR = Math.min(8, 4 + Math.log2(hitCount));
    magDotGroup.append('circle')
      .attr('class', 'mag-dot')
      .attr('cx', mx0).attr('cy', my0)
      .attr('r', 0)
      .attr('fill', c1)
      .attr('opacity', 1)
      .transition().duration(300).attr('r', dotR);

    // Destination dot (self)
    if (selfPos) {
      magDotGroup.append('circle')
        .attr('class', 'mag-self-dot')
        .attr('cx', mx1).attr('cy', my1)
        .attr('r', 5);
    }

    // Source label
    const label = ev.src_city && ev.src_cc
      ? `${ev.src_city}, ${ev.src_cc}`
      : ev.src_city || ev.src_cc || ev.src_ip || '';
    if (label) {
      magDotGroup.append('text')
        .attr('x', mx0 + 8).attr('y', my0 - 6)
        .attr('fill', '#c8d8f0')
        .attr('font-size', '11px')
        .attr('font-family', 'inherit')
        .text(label);
    }

    // Show the magnifier
    magShow();
  }

  function magShow() {
    if (!magVisible) {
      magVisible = true;
      magEl.classList.add('visible');
    }
    // Reset idle timer
    if (magIdleTimer) clearTimeout(magIdleTimer);
    magIdleTimer = setTimeout(magHide, MAG_IDLE_MS);
  }

  function magHide() {
    magVisible = false;
    magEl.classList.remove('visible');
    magIdleTimer = null;
  }

  // ── Self dot ─────────────────────────────────────────────────────────────
  let selfDotEl = null;

  function drawSelfDot() {
    if (!selfPos) return;
    const [sx, sy] = projection([selfPos.lon, selfPos.lat]);
    if (selfDotEl) selfDotEl.remove();
    selfDotEl = dotGroup.append('circle')
      .attr('class', 'self-dot')
      .attr('cx', sx)
      .attr('cy', sy)
      .attr('r', 5)
      .attr('filter', 'url(#glow-blue)');
  }

  // ── Resize ───────────────────────────────────────────────────────────────
   function resize() {
     const d = dims();
     w = d.w; h = d.h;
     projection
       .scale(w / 6.3)
       .translate([w / 2, h / 2]);

     sphereGroup.select('path').attr('d', path);
     graticuleGroup.select('path').attr('d', path);
     landGroup.selectAll('path').attr('d', path);

     // Reproject all source dots using their stored [lon, lat] datum
     dotGroup.selectAll('.src-dot').each(function(d) {
       if (!d) return;
       const [x, y] = projection(d);
       d3.select(this).attr('cx', x).attr('cy', y);
     });

     drawSelfDot();
   }

  window.addEventListener('resize', () => resize());

  // ── Self info ────────────────────────────────────────────────────────────
  fetch('/api/self')
    .then(r => r.json())
    .then(data => {
      selfPos = { lat: data.lat, lon: data.lon, ip: data.ip, city: data.city, cc: data.cc };
      document.getElementById('my-ip').textContent = data.ip || '—';
      document.getElementById('my-loc').textContent =
        [data.city, data.cc].filter(Boolean).join(', ') || '—';
      drawSelfDot();
    })
    .catch(e => console.warn('Self info fetch failed:', e));

  // ── Port legend ───────────────────────────────────────────────────────────
  const portRowsEl = document.getElementById('port-rows');

  // Dirty flags — set true when data changes; cleared after each render
  let legendDirty = false, countryDirty = false, ipDirty = false, serviceDirty = false;
  let logDirty = false;
  let logRafScheduled = false;

  // ── Sidebar renders on a 2-second interval (decoupled from events) ──
  // Uses requestIdleCallback to avoid competing with arc animations.
  // Falls back to setTimeout for browsers without rIC support.
  const scheduleIdle = window.requestIdleCallback
    ? (fn) => requestIdleCallback(fn, { timeout: 3000 })
    : (fn) => setTimeout(fn, 100);

  function sidebarLoop() {
    scheduleIdle(() => {
      renderSidebar();
      setTimeout(sidebarLoop, 2000);
    });
  }
  setTimeout(sidebarLoop, 2000);

  function renderSidebar() {
    renderLegend();
    renderCountry();
    renderIP();
    renderServiceStats();
  }

  // ── Log/arc rendering stays on rAF for low-latency display ──
  function scheduleLogRender() {
    if (logRafScheduled) return;
    logRafScheduled = true;
    requestAnimationFrame(() => { logRafScheduled = false; flushLog(); });
  }

  function updateLegend(port) {
    if (!portStats[port]) {
      const color = PORT_COLORS[portColorIdx % PORT_COLORS.length];
      portColorIdx++;
      portStats[port] = { count: 0, color };
    }
    portStats[port].count++;
    legendDirty = true;
  }

  function renderLegend() {
    if (!legendDirty) return;
    legendDirty = false;

    const top10 = Object.entries(portStats)
      .sort((a, b) => b[1].count - a[1].count)
      .slice(0, 10)
      .map(([port]) => port);
    const top10Set = new Set(top10);

    // Remove rows that are no longer in the top 10
    portRowsEl.querySelectorAll('.port-row').forEach(r => {
      const port = r.id.replace('port-row-', '');
      if (!top10Set.has(port)) r.remove();
    });

    // Create or update rows for the top 10
    top10.forEach(port => {
      const stat = portStats[port];
      let row = document.getElementById(`port-row-${port}`);
      if (!row) {
        row = document.createElement('div');
        row.className = 'port-row';
        row.id = `port-row-${port}`;
        row.innerHTML =
          `<span class="port-swatch" style="background:${stat.color};box-shadow:0 0 5px ${stat.color}"></span>` +
          `<span class="port-label"><span class="port-num">:${port}</span></span>` +
          `<span class="port-count" id="port-count-${port}">0</span>`;
        portRowsEl.appendChild(row);
      }
      const countEl = document.getElementById(`port-count-${port}`);
      const countStr = String(stat.count);
      if (countEl.textContent !== countStr) countEl.textContent = countStr;
    });

    // Re-order rows only if current DOM order differs from sorted order
    const currentOrder = [...portRowsEl.querySelectorAll('.port-row')].map(r => r.id.replace('port-row-', ''));
    const orderChanged = top10.length !== currentOrder.length || top10.some((p, i) => p !== currentOrder[i]);
    if (orderChanged) {
      top10.forEach(port => {
        const row = document.getElementById(`port-row-${port}`);
        if (row) portRowsEl.appendChild(row);
      });
    }
  }

  // ── Country stats ─────────────────────────────────────────────────────────
  const countryStats = {}; // { cc -> count }
  const countryRowsEl = document.getElementById('country-rows');
  const countryRowMap = new Map(); // cc -> DOM row

  function updateCountry(cc) {
    if (!cc) return;
    countryStats[cc] = (countryStats[cc] || 0) + 1;
    countryDirty = true;
  }

  function renderCountry() {
    if (!countryDirty) return;
    countryDirty = false;
    const top = Object.entries(countryStats).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const topSet = new Set(top.map(([cc]) => cc));

    // Remove rows no longer in top 10
    for (const [cc, row] of countryRowMap) {
      if (!topSet.has(cc)) { row.remove(); countryRowMap.delete(cc); }
    }

    // Create or update rows
    top.forEach(([cc, count]) => {
      let row = countryRowMap.get(cc);
      if (!row) {
        row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `<span class="stat-label"></span><span class="stat-count"></span>`;
        countryRowsEl.appendChild(row);
        countryRowMap.set(cc, row);
      }
      if (row.children[0].textContent !== cc) row.children[0].textContent = cc;
      const countStr = String(count);
      if (row.children[1].textContent !== countStr) row.children[1].textContent = countStr;
    });

    // Reorder only if current DOM order differs from sorted order
    const currentKeys = [...countryRowsEl.children].map(r => r.children[0].textContent);
    const sortedKeys = top.map(([cc]) => cc);
    const orderChanged = sortedKeys.length !== currentKeys.length || sortedKeys.some((k, i) => k !== currentKeys[i]);
    if (orderChanged) {
      top.forEach(([cc]) => countryRowsEl.appendChild(countryRowMap.get(cc)));
    }
  }

  // ── IP stats ──────────────────────────────────────────────────────────────
  const ipStats = {}; // { ip -> count }
  const ipRowsEl = document.getElementById('ip-rows');
  const ipRowMap = new Map(); // ip -> DOM row

  function updateIP(ip) {
    if (!ip) return;
    ipStats[ip] = (ipStats[ip] || 0) + 1;
    ipDirty = true;
  }

  function renderIP() {
    if (!ipDirty) return;
    ipDirty = false;
    const top = Object.entries(ipStats).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const topSet = new Set(top.map(([ip]) => ip));

    // Remove rows no longer in top 10
    for (const [ip, row] of ipRowMap) {
      if (!topSet.has(ip)) { row.remove(); ipRowMap.delete(ip); }
    }

    // Create or update rows
    top.forEach(([addr, count]) => {
      let row = ipRowMap.get(addr);
      if (!row) {
        row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `<span class="stat-label"></span><span class="stat-count"></span>`;
        ipRowsEl.appendChild(row);
        ipRowMap.set(addr, row);
      }
      if (row.children[0].textContent !== addr) row.children[0].textContent = addr;
      const countStr = String(count);
      if (row.children[1].textContent !== countStr) row.children[1].textContent = countStr;
    });

    // Reorder only if current DOM order differs from sorted order
    const currentKeys = [...ipRowsEl.children].map(r => r.children[0].textContent);
    const sortedKeys = top.map(([addr]) => addr);
    const orderChanged = sortedKeys.length !== currentKeys.length || sortedKeys.some((k, i) => k !== currentKeys[i]);
    if (orderChanged) {
      top.forEach(([addr]) => ipRowsEl.appendChild(ipRowMap.get(addr)));
    }
  }

  // ── Service stats ─────────────────────────────────────────────────────────
  // Maps port number (string) → human-readable service name
  const PORT_SERVICE_NAMES = {
    '21': 'FTP', '22': 'SSH', '23': 'Telnet', '25': 'SMTP',
    '53': 'DNS', '80': 'HTTP', '110': 'POP3', '123': 'NTP',
    '143': 'IMAP', '161': 'SNMP', '443': 'HTTPS', '445': 'SMB',
    '1433': 'MSSQL', '1900': 'SSDP', '3000': 'Node/Express',
    '3001': 'Node alt', '3128': 'Squid', '3306': 'MySQL', '3389': 'RDP',
    '4000': 'Phoenix', '4200': 'Angular', '5000': 'Flask', '5001': 'Flask alt',
    '5060': 'SIP', '5432': 'PostgreSQL', '5900': 'VNC', '6379': 'Redis',
    '8000': 'HTTP alt', '8008': 'HTTP alt', '8080': 'HTTP proxy', '8081': 'HTTP proxy',
    '8088': 'HTTP alt', '8090': 'Confluence', '8443': 'HTTPS alt', '8888': 'Jupyter',
    '9000': 'SonarQube', '9090': 'Prometheus', '9200': 'Elasticsearch',
    '11211': 'Memcached', '25565': 'Minecraft', '27017': 'MongoDB',
  };

  const serviceStats = {}; // { port -> count }
  const serviceRowsEl = document.getElementById('service-rows');
  const serviceRowMap = new Map(); // port -> { row, countEl, barEl }

  function updateServiceStats(port) {
    if (!port) return;
    serviceStats[port] = (serviceStats[port] || 0) + 1;
    serviceDirty = true;
  }

  function renderServiceStats() {
    if (!serviceDirty) return;
    serviceDirty = false;
    const top = Object.entries(serviceStats).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const topSet = new Set(top.map(([p]) => p));
    const maxCount = top.length > 0 ? top[0][1] : 1;

    // Remove rows no longer in top 10
    for (const [p, entry] of serviceRowMap) {
      if (!topSet.has(p)) { entry.row.remove(); serviceRowMap.delete(p); }
    }

    // Create or update rows
    top.forEach(([p, count]) => {
      const svcName = PORT_SERVICE_NAMES[p] || `port ${p}`;
      const portColor = portStats[p]?.color || '#546e7a';
      const pct = Math.max(4, Math.round((count / maxCount) * 100));
      let entry = serviceRowMap.get(p);
      if (!entry) {
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.style.flexDirection = 'column';
        row.style.alignItems = 'stretch';
        row.style.gap = '2px';
        row.innerHTML =
          `<div style="display:flex;align-items:center;gap:6px;">` +
            `<span class="stat-label" style="color:${portColor}">:${p} <span style="color:#78909c;font-weight:400">${svcName}</span></span>` +
            `<span class="stat-count"></span>` +
          `</div>` +
          `<div style="height:3px;border-radius:2px;background:rgba(255,255,255,0.07);overflow:hidden;">` +
            `<div style="height:100%;width:0%;background:${portColor};opacity:0.7;border-radius:2px;"></div>` +
          `</div>`;
        const countEl = row.querySelector('.stat-count');
        const barEl = row.querySelector('div > div:last-child > div');
        entry = { row, countEl, barEl };
        serviceRowsEl.appendChild(row);
        serviceRowMap.set(p, entry);
      }
      const countStr = String(count);
      if (entry.countEl.textContent !== countStr) entry.countEl.textContent = countStr;
      const pctStr = pct + '%';
      if (entry.barEl.style.width !== pctStr) entry.barEl.style.width = pctStr;
    });

    // Reorder only if current DOM order differs from sorted order
    const currentKeys = [...serviceRowsEl.children].map(r => {
      const label = r.querySelector('.stat-label');
      return label ? label.textContent.split(' ')[0].replace(':', '') : '';
    });
    const sortedKeys = top.map(([p]) => p);
    const orderChanged = sortedKeys.length !== currentKeys.length || sortedKeys.some((k, i) => k !== currentKeys[i]);
    if (orderChanged) {
      top.forEach(([p]) => serviceRowsEl.appendChild(serviceRowMap.get(p).row));
    }
  }

  // ── Arc drawing ──────────────────────────────────────────────────────────
  let arcSeq = 0;

  // Colour palette cycling for distinct arcs
  const PALETTE = [
    ['#ff9800', '#4fc3f7'],
    ['#ef5350', '#80cbc4'],
    ['#ab47bc', '#fff176'],
    ['#26c6da', '#ff8a65'],
    ['#66bb6a', '#f48fb1'],
  ];

  // ── Adaptive arc rate control ────────────────────────────────────────────
  // Track event timestamps in a 1-second sliding window to measure rate.
  const FLOOD_THRESHOLD = 10;  // events/sec — above this we batch
  const arcTimestamps = [];    // recent event arrival times (ms)

  function currentRate() {
    const now = performance.now();
    // Evict timestamps older than 1 second
    while (arcTimestamps.length > 0 && now - arcTimestamps[0] > 1000) {
      arcTimestamps.shift();
    }
    return arcTimestamps.length;
  }

  // Flood buffer — only used when rate >= FLOOD_THRESHOLD
  // Key: src_ip  Value: { ev, count } — deduplicates floods from same IP
  const arcBuffer = new Map();
  let floodFlushTimer = null;

  function handleArc(ev) {
    if (!ev.src_lon && !ev.src_lat) return;
    arcTimestamps.push(performance.now());

    if (currentRate() < FLOOD_THRESHOLD) {
      // Normal traffic — draw immediately, no latency
      drawArc(ev, 1);
    } else {
      // Flood — buffer and deduplicate by source IP
      const key = ev.src_ip || `${ev.src_lon},${ev.src_lat}`;
      if (arcBuffer.has(key)) {
        arcBuffer.get(key).count++;
      } else {
        arcBuffer.set(key, { ev, count: 1 });
      }
      // Ensure a flush is scheduled (only one timer at a time)
      if (!floodFlushTimer) {
        floodFlushTimer = setTimeout(flushArcs, 1000);
      }
    }
  }

  // stroke-width scales with hit count: 1 hit → 1.5px, 10+ hits → 6px
  function arcWidth(count) {
    return Math.min(6, 1.5 + (count - 1) * 0.5);
  }

  function flushArcs() {
    floodFlushTimer = null;
    if (arcBuffer.size === 0) return;
    const entries = [...arcBuffer.values()];
    arcBuffer.clear();
    entries.forEach(({ ev, count }) => drawArc(ev, count));
  }

  function drawArc(ev, hitCount = 1) {
    const srcPt = [ev.src_lon, ev.src_lat];
    const dstPt = [ev.dst_lon, ev.dst_lat];

    if (!srcPt[0] && !srcPt[1]) return; // no geo data

    // Use the port's assigned color as c1 if available, else cycle palette
    const portColor = portStats[ev.dst_port]?.color;
    const [c1, c2] = portColor
      ? [portColor, '#ffffff']
      : PALETTE[arcSeq % PALETTE.length];
    arcSeq++;

    const [x0, y0] = projection(srcPt);
    const [x1, y1] = projection(dstPt);

    // Reuse pooled gradient by color pair
    const gradEntry = acquireGradient(c1, c2, x0, y0, x1, y1);

    // Detect antimeridian crossing — when source and dest longitudes are
    // far apart and on opposite sides, the great-circle path crosses the
    // date line.  In that case, use d3.geoPath which handles clipping
    // correctly, instead of d3.line which draws straight pixel segments.
    const lonDiff = Math.abs(srcPt[0] - dstPt[0]);
    const crossesAntimeridian = lonDiff > 180;

    let fullD, lineData;

    if (crossesAntimeridian) {
      // Build a GeoJSON LineString from great-circle samples — geoPath
      // will clip and split it at the antimeridian automatically.
      const interp = d3.geoInterpolate(srcPt, dstPt);
      const N = 40; // more samples for accuracy across the split
      const geoCoords = [];
      for (let i = 0; i <= N; i++) geoCoords.push(interp(i / N));
      const geoLine = { type: 'LineString', coordinates: geoCoords };
      fullD = path(geoLine);
      // For path length, project the clipped result's points
      // Use a rough estimate from the projected endpoints on each side
      lineData = geoCoords.map(c => projection(c));
    } else {
      // Normal path — 20 samples with natural curve
      const interp = d3.geoInterpolate(srcPt, dstPt);
      const N = 20;
      lineData = [];
      for (let i = 0; i <= N; i++) lineData.push(projection(interp(i / N)));
      const lineGen = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveNatural);
      fullD = lineGen(lineData);
    }

    const sw = arcWidth(hitCount);
    const arcPath = arcGroup.append('path')
      .attr('class', 'arc-path')
      .attr('d', fullD)
      .attr('stroke', `url(#${gradEntry.id})`)
      .attr('stroke-width', sw)
      .attr('opacity', 0);

    // Approximate path length from segment distances (avoids synchronous getTotalLength)
    // For antimeridian-crossing arcs, the projected points jump across the SVG
    // so we must use the rendered path's getTotalLength instead.
    let totalLen = 0;
    if (crossesAntimeridian) {
      totalLen = arcPath.node().getTotalLength();
    } else {
      for (let i = 1; i < lineData.length; i++) {
        const dx = lineData[i][0] - lineData[i - 1][0];
        const dy = lineData[i][1] - lineData[i - 1][1];
        totalLen += Math.sqrt(dx * dx + dy * dy);
      }
    }

    // Animate stroke-dash draw-on, then fade and remove (~2.6s total lifespan)
    arcPath
      .attr('stroke-dasharray', totalLen)
      .attr('stroke-dashoffset', totalLen)
      .attr('opacity', 1)
      .transition()
        .duration(800)
        .ease(d3.easeQuadInOut)
        .attr('stroke-dashoffset', 0)
      .transition()
        .delay(1200)
        .duration(600)
        .attr('opacity', 0)
      .on('end', () => {
        arcPath.remove();
        releaseGradient(c1, c2);
      });

    trackArc(arcPath.node());

    // Source dot — animates in bright, then settles as a persistent faded dot
    const dotR = Math.min(6, 3 + Math.log2(hitCount));
    const srcDot = dotGroup.append('circle')
      .attr('class', 'src-dot')
      .attr('cx', x0)
      .attr('cy', y0)
      .attr('r', 0)
      .attr('fill', c1)
      .attr('opacity', 1)
      .style('cursor', 'crosshair')
      .datum(srcPt); // store [lon, lat] for reprojection on resize

    attachTooltip(srcDot, tooltipLabel(ev, hitCount));

    srcDot.transition().duration(300).attr('r', dotR + 1)
      .transition().delay(2500).duration(600)
        .attr('r', dotR)
        .attr('opacity', 0.35);

    trackDot(srcDot.node());

    // Trigger magnifier inset only for short arcs (roughly US-width or less).
    // Compare pixel distance between src and dst to a fraction of SVG width.
    const arcPixelDist = Math.sqrt((x1 - x0) ** 2 + (y1 - y0) ** 2);
    if (arcPixelDist < w * 0.25) {
      magShowArc(ev, srcPt, dstPt, c1, c2, hitCount);
    }
  }

  // ── Dot lifecycle cap ───────────────────────────────────────────────────
  const MAX_DOTS = 1000;
  const dotRing = []; // circular buffer of DOM nodes

  function trackDot(node) {
    dotRing.push(node);
    while (dotRing.length > MAX_DOTS) {
      const old = dotRing.shift();
      if (old.parentNode) old.parentNode.removeChild(old);
    }
  }

  // ── Arc lifecycle cap ─────────────────────────────────────────────────
  const MAX_ARCS = 150;
  const arcRing = []; // circular buffer of arc path DOM nodes

  function trackArc(node) {
    arcRing.push(node);
    while (arcRing.length > MAX_ARCS) {
      const old = arcRing.shift();
      if (old.parentNode) old.parentNode.removeChild(old);
    }
  }

  // ── Log panel ─────────────────────────────────────────────────────────────
  const logPanel = document.getElementById('log-panel');
  const logBuffer = []; // pending entries, flushed on next rAF

  function addLog(ev) {
    logBuffer.push(ev);
    logDirty = true;
    scheduleLogRender();
  }

  function flushLog() {
    if (!logDirty) return;
    logDirty = false;
    if (logBuffer.length === 0) return;
    const entries = logBuffer.splice(0); // drain buffer atomically
    // Build a fragment so we touch the DOM once per frame
    const frag = document.createDocumentFragment();
    entries.forEach(ev => {
      const t = new Date(ev.time);
      const ts = t.toLocaleTimeString('en-US', { hour12: false });
      const srcLabel = [ev.src_ip, ev.src_city, ev.src_cc].filter(Boolean).join(' / ');
      const portNum = ev.dst_port && ev.dst_port !== 'unknown' ? ev.dst_port : '';
      const svcName = portNum ? (PORT_SERVICE_NAMES[portNum] || '') : '';
      const portLabel = portNum ? `:${portNum}${svcName ? ' ' + svcName : ''}` : '';
      const protoLabel = ev.protocol ? ev.protocol.toUpperCase() : '';
      const row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML =
        `<span class="log-time">${ts}</span>` +
        `<span class="log-src">${srcLabel}</span>` +
        `${portLabel ? '<span class="log-arrow">→</span><span class="log-port">' + portLabel + '</span>' : ''}` +
        `${protoLabel ? '<span class="log-proto">' + protoLabel + '</span>' : ''}`;
      if (ev.src_lat && ev.src_lon) {
        row.addEventListener('click', () => {
          drawArc(ev, 1);
          row.classList.add('arc-flash');
          setTimeout(() => row.classList.remove('arc-flash'), 400);
        });
      } else {
        row.style.cursor = 'default';
      }
      frag.prepend ? frag.prepend(row) : frag.insertBefore(row, frag.firstChild);
    });
    logPanel.prepend(frag);
    // Trim to 200 entries in one pass
    while (logPanel.children.length > 200) {
      logPanel.removeChild(logPanel.lastChild);
    }
  }

  // ── WebSocket ─────────────────────────────────────────────────────────────
  const wsStatus = document.getElementById('ws-status');
  const connCountEl = document.getElementById('conn-count');
  const dotTooltip = document.getElementById('dot-tooltip');

  function tooltipLabel(ev, hitCount = 1) {
    const city = ev.src_city || '';
    const cc   = ev.src_cc   || '';
    const loc  = (city && cc) ? `${city}, ${cc}` : city || cc || ev.src_ip || '';
    return hitCount > 1 ? `${loc} ×${hitCount}` : loc;
  }

  function attachTooltip(sel, label) {
    sel
      .on('mouseover', function(event) {
        if (!label) return;
        dotTooltip.textContent = label;
        dotTooltip.style.display = 'block';
      })
      .on('mousemove', function(event) {
        dotTooltip.style.left = (event.clientX + 12) + 'px';
        dotTooltip.style.top  = (event.clientY - 28) + 'px';
      })
      .on('mouseout', function() {
        dotTooltip.style.display = 'none';
      });
  }

  // Draw a faded static dot for historical events (no arc animation)
  function drawHistoryDot(ev) {
    if (!ev.src_lon && !ev.src_lat) return;
    const srcPt = [ev.src_lon, ev.src_lat];
    const [x, y] = projection(srcPt);
    const portColor = portStats[ev.dst_port]?.color || '#546e7a';
    const dot = dotGroup.append('circle')
      .attr('class', 'src-dot')
      .attr('cx', x).attr('cy', y).attr('r', 3)
      .attr('fill', portColor)
      .attr('opacity', 0.35)
      .style('cursor', 'crosshair')
      .datum(srcPt); // store [lon, lat] for reprojection on resize
    attachTooltip(dot, tooltipLabel(ev));
    trackDot(dot.node());
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);

    ws.onopen = () => {
      wsStatus.className = 'connected';
    };

    ws.onmessage = (msg) => {
      let ev;
      try { ev = JSON.parse(msg.data); } catch { return; }

      connCount++;
      connCountEl.textContent = connCount;

      updateLegend(ev.dst_port || 'unknown');
      updateCountry(ev.src_cc);
      updateIP(ev.src_ip);
      updateServiceStats(ev.dst_port || 'unknown');
      addLog(ev);

      if (ev.replay) {
        drawHistoryDot(ev);
        // Flush log every 200 replay events so the log panel
        // populates progressively instead of staying empty.
        if (connCount % 200 === 0) flushLog();
      } else {
        // First live event after replay — flush sidebar once immediately
        // so panels are populated without waiting for the 2s timer.
        if (!replayDone) {
          replayDone = true;
          renderSidebar();
          flushLog();
        }
        handleArc(ev);  // instant at low rate, batched during floods
      }
    };

    ws.onclose = () => {
      wsStatus.className = 'disconnected';
      // Reconnect after 2s
      setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();

})();
</script>
</body>
</html>
